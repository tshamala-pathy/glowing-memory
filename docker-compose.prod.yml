# Production stack: PostgreSQL + Django/Gunicorn + nginx (React SPA + reverse proxy).
#
# Usage:
#   cp .env.production.example .env
#   # Edit .env with real secrets, domains, and PayFast credentials
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Public site: http://localhost (or your DOMAIN)
# API health:  http://localhost/api/health/

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pathycode}
      POSTGRES_USER: ${DB_USER:-pathycode}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-pathycode} -d ${DB_NAME:-pathycode}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/health/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - media_data:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
