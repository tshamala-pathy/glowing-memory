name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: 'True'
      DB_ENGINE: django.db.backends.sqlite3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q -x "(venv|frontend/node_modules|docs/_build)" .

      - name: Django system check
        run: python manage.py check

      - name: Pre-deploy script (dev mode)
        run: python scripts/check_deploy.py

      - name: Run Django tests
        run: python manage.py test --verbosity=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        env:
          CI: true
        run: npm run test:ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
          REACT_APP_BACKEND_URL: http://localhost:8000
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Build backend Docker image
        run: docker build -t pathycodeback:test .

      - name: Build frontend nginx Docker image
        run: docker build -t pathycode-nginx:test -f frontend/Dockerfile .
